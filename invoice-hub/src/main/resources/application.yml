spring:
  application:
    name: invoice-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoicehub}
    username: ${DB_USER:invoicehub}
    # Secrets have no default here. For the local stack they are set in application-local.yml.
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Values are JSON, converted by the Jackson message converter of Spring Modulith.
    producer:
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      auto-offset-reset: earliest
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    # Carries the trace context from the upload over Kafka to the ERP call.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  modulith:
    events:
      # Events that were saved but not sent to Kafka before a shutdown are sent after the restart.
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/invoice-hub}
          # Only tokens that Keycloak issued for the hub, not for other applications of the realm.
          audiences: invoice-hub
          authorities-claim-expressions: "[realm_access][roles]"
          authority-prefix: ROLE_
  servlet:
    multipart:
      # Invoices are mostly smaller than 1 MB, ZUGFeRD PDFs with images can have a few MB.
      max-file-size: 10MB
      max-request-size: 10MB

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        # Default is 1m, too slow to watch the dashboard during a demo.
        step: 10s
  tracing:
    sampling:
      # Default is 10%. Every invoice must be traceable.
      probability: 1.0

logging:
  level:
    # Logs every SSH connection on INFO, so with every poll of the SFTP intake.
    org.apache.sshd: warn

invoice-hub:
  erp:
    base-url: ${ERP_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 10s
  mail:
    protocol: imap
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:3143}
    username: ${MAIL_USER:invoices}
    password: ${MAIL_PASSWORD}
    inbox-folder: INBOX
    processed-folder: processed
    unprocessed-folder: unprocessed
    poll-interval: 30s
    timeout: 10s
  sftp:
    host: ${SFTP_HOST:localhost}
    port: ${SFTP_PORT:2222}
    username: ${SFTP_USER:invoices}
    private-key: ${SFTP_PRIVATE_KEY}
    # For the SFTP server from docker-compose.yml. Relative to invoice-hub, the working directory of spring-boot:run.
    known-hosts: ${SFTP_KNOWN_HOSTS:file:../docker/sftp/known_hosts}
    inbox-directory: /inbox
    processed-directory: /processed
    failed-directory: /failed
    # Files changed more recently may still be uploaded.
    min-file-age: 5s
    poll-interval: 30s
    timeout: 10s
  delivery:
    retry:
      # Retries after 10s, 30s and 90s, then the event goes to the DLT
      delay: 10s
      multiplier: 3
