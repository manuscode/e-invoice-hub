services:
  # For the hub from the IDE (spring-boot:run) start the stack without it: docker compose up -d --scale invoice-hub=0
  invoice-hub:
    build:
      context: .
      dockerfile: invoice-hub/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/invoicehub
      DB_PASSWORD: invoicehub
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # The issuer is the URL clients on the host get their tokens from, see KC_HOSTNAME. The keys are loaded
      # inside the compose network.
      OAUTH2_ISSUER_URI: http://localhost:8180/realms/invoice-hub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/invoice-hub/protocol/openid-connect/certs
      ERP_BASE_URL: http://erp-simulator:8081
      MAIL_HOST: greenmail
      MAIL_PASSWORD: invoices
      SFTP_HOST: sftp
      SFTP_PORT: 22
      SFTP_PRIVATE_KEY: file:/config/sftp/invoice-hub_ecdsa
      SFTP_KNOWN_HOSTS: file:/config/sftp/known_hosts
      OTLP_ENDPOINT: http://lgtm:4318
    volumes:
      - ./docker/sftp:/config/sftp:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health > /dev/null"]
      interval: 5s
      start_period: 60s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: invoicehub
      POSTGRES_USER: invoicehub
      POSTGRES_PASSWORD: invoicehub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicehub -d invoicehub"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for clients on the host, DOCKER for containers in the compose network (e.g. the load test).
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      retries: 10

  erp-simulator:
    build:
      context: .
      dockerfile: erp-simulator/Dockerfile
    environment:
      ERP_LATENCY: 200ms
      ERP_FAILURE_RATE: 0.1
      OTLP_ENDPOINT: http://lgtm:4318
    ports:
      - "8081:8081"

  greenmail:
    image: greenmail/standalone:2.1.13
    environment:
      # Only SMTP and IMAP, with a fixed mailbox instead of accepting every login.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=invoices:invoices@invoice-hub.local
    ports:
      - "3025:3025"
      - "3143:3143"

  sftp:
    image: atmoz/sftp:alpine@sha256:a81ea210713555be76075b4b2788a4addfaa54d137cd881f3a99ac539f0be2c5
    # User without password, login only with the key of invoice-hub. Keys in docker/sftp are for local use only.
    command: invoices::1001:100:inbox,processed,failed
    volumes:
      - ./docker/sftp/invoice-hub_ecdsa.pub:/home/invoices/.ssh/keys/invoice-hub_ecdsa.pub:ro
      # Fixed host key, so docker/sftp/known_hosts stays valid when the container is recreated. Only RSA, because
      # the SSH client of invoice-hub (Apache MINA SSHD) can't read ed25519 keys without an additional provider.
      - ./docker/sftp/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key
    ports:
      - "2222:22"

  # Demo realm with the clients demo-uploader and demo-reader. Only for local use, fixed secrets and admin/admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Same issuer in all tokens, no matter if requested from the host or inside the compose network (k6).
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./docker/keycloak/invoice-hub-realm.json:/opt/keycloak/data/import/invoice-hub-realm.json:ro
    ports:
      - "8180:8080"

  # Grafana with Loki, Tempo and Prometheus behind one OpenTelemetry collector. Only for local use, no login.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    volumes:
      - ./docker/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/invoice-hub.yaml:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards/invoice-hub:ro
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres-data:
