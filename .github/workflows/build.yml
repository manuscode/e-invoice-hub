name: Build

on:
  push:
    branches: [main]
  pull_request:

# The build only reads the repository. Code from pull requests gets no write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify
